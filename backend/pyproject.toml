[project]
name = "blob"
version = "0.1.0"
description = "Blob voice assistant backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "faster-whisper",
    "kokoro-onnx",
    "onnxruntime",
]

[project.scripts]
blob = "blob.main:run"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "websockets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blob"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "kokoro_onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["gpu: loads the real speech models (skipped in CI; runs on CPU or GPU)"]

[tool.coverage.run]
source = ["blob"]
# The model wrappers are covered by the real-model smoke test, not by unit tests.
omit = ["blob/stt.py", "blob/tts.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
