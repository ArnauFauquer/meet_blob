[project]
name = "blob"
version = "0.1.0"
description = "Blob voice assistant backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "faster-whisper",
    "kokoro-onnx",
    # Kokoro runs on the GPU in the image (KOKORO_DEVICE=cuda). onnxruntime-gpu 1.31 is built
    # for CUDA 13 and loads cuDNN and the CUDA libraries from these pip wheels
    # (onnxruntime.preload_dlls); its "cuda" extra leaves out cuBLAS. CTranslate2 keeps using
    # the image's CUDA 12 cuBLAS: both runtimes load side by side. It also runs on the CPU, so
    # CI and dev machines without a GPU use the same package. Other platforms get the CPU one.
    "onnxruntime-gpu[cuda,cudnn]; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cublas; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.scripts]
blob = "blob.main:run"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "websockets",
]

[tool.uv]
# faster-whisper and kokoro-onnx require "onnxruntime"; on linux x86_64 onnxruntime-gpu provides
# the same module, and both installed at once overwrite each other.
override-dependencies = ["onnxruntime; sys_platform != 'linux' or platform_machine != 'x86_64'"]
# kube1's driver (580) supports CUDA <= 13.0.
constraint-dependencies = [
    "nvidia-cuda-runtime==13.0.*",
    "nvidia-cuda-nvrtc==13.0.*",
    "nvidia-cublas==13.0.*",
    "nvidia-cufft==12.0.*",
    "nvidia-nvjitlink==13.0.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blob"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "kokoro_onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: loads the real speech models (skipped in CI; runs on CPU or GPU)"]

[tool.coverage.run]
source = ["blob"]
# The model wrappers are covered by the real-model smoke test, not by unit tests.
omit = ["blob/stt.py", "blob/tts.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
