<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Blob</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      #blob { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #fault {
        position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom));
        text-align: center; color: rgba(255, 255, 255, 0.38);
        font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.02em;
        pointer-events: none;
      }
      #diag {
        position: fixed; top: 16px; left: 16px; max-width: calc(100vw - 32px); box-sizing: border-box;
        padding: 12px 16px; border-radius: 10px; background: rgba(12, 12, 16, 0.86);
        color: #cfd3dc; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
      }
      #diag pre { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
      #diag button {
        font: inherit; color: #fff; background: #2a2d36; border: 1px solid #444a58; border-radius: 6px;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="blob"></canvas>
    <div id="fault" role="status" aria-live="polite"></div>
    <div id="diag" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
